name: Rust Window Comparator Build

on:
  push:
    tags:
      - 'window-comparator/v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/rust-plugins.yml
    with:
      plugin_name: Rust Window Comparator
      artifact_file: rust-window-comparator.o
      artifact_base_name: rust-window-comparator
