name: Reusable Rust plugin build

on:
  workflow_call:
    inputs:
      plugin_name:
        description: Plugin display name
        required: true
        type: string
      artifact_file:
        description: Compiled plugin filename under plugins/
        required: true
        type: string
      artifact_base_name:
        description: Build artifact name
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test ${{ inputs.plugin_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOOLCHAIN_IMAGE: disting-nt-rust-ci:latest
      ARTIFACT_FILE: ${{ inputs.artifact_file }}

    steps:
      - name: Checkout repository and pinned API submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer toolchain with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ${{ env.TOOLCHAIN_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=rust-devcontainer
          cache-to: type=gha,scope=rust-devcontainer,mode=max

      - name: Check formatting, build plugin, and test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env ARTIFACT_FILE \
            "$TOOLCHAIN_IMAGE" \
            sh -ec 'cargo fmt --all -- --check; make "plugins/$ARTIFACT_FILE"; make test'

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_base_name }}-build-${{ github.run_number }}
          path: plugins/${{ inputs.artifact_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Format release name
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          printf 'name=%s\n' "${GITHUB_REF_NAME//\// }" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.name }}
          files: plugins/${{ inputs.artifact_file }}
          fail_on_unmatched_files: true
          body: |
            Automated build for release tag ${{ github.ref_name }}.
            Includes the compiled plugin binary (${{ inputs.artifact_file }}).
